// =============================================================================
// hardening/templates/server.cfg
// =============================================================================
// Template de configuração segura para servidores Counter-Strike 1.6 / HLDS
//
// Autor : Higor Samuel — Unimontes / DTI
// Ref   : https://developer.valvesoftware.com/wiki/CS_1.6_Server_Configuration
//
// INSTRUÇÕES:
//   1. Copie para: cstrike/server.cfg
//   2. Substitua todos os valores marcados com <ALTERE_AQUI>
//   3. Reinicie o servidor após aplicar
// =============================================================================


// ---------------------------------------------------------------------------
// IDENTIDADE DO SERVIDOR
// ---------------------------------------------------------------------------

// Nome público exibido na lista de servidores (Steam/GameSpy)
hostname "<ALTERE_AQUI> - Servidor CS 1.6"

// Região do servidor (16 = Brasil / América do Sul)
sv_region 16

// Mensagem de boas-vindas exibida ao conectar
motd_viewer 1


// ---------------------------------------------------------------------------
// SEGURANÇA — RCON (Remote Console)
// ---------------------------------------------------------------------------

// CRÍTICO: Use uma senha forte com no mínimo 32 caracteres
// Gere uma senha aleatória: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
rcon_password "<ALTERE_AQUI_SENHA_FORTE_32_CHARS>"

// Máximo de tentativas de autenticação RCON antes do ban automático
sv_rcon_maxfailures 3

// Janela de tempo (segundos) para contabilizar as tentativas acima
sv_rcon_minfailuretime 30

// Duração do ban automático após exceder sv_rcon_maxfailures (minutos)
// 0 = ban permanente, requer reinício do servidor para liberar
sv_rcon_banpenalty 1440     // 24 horas

// Registrar tentativas de autenticação RCON no log
// (recomendado para monitoramento defensivo)
// sv_logbans 1  // Descomente se quiser logar bans por RCON


// ---------------------------------------------------------------------------
// SEGURANÇA — ACESSO AO SERVIDOR
// ---------------------------------------------------------------------------

// Senha para entrar no servidor (deixe vazio "" para servidor público)
// sv_password "<SOMENTE_SE_PRIVADO>"

// Valve Anti-Cheat — SEMPRE habilite em servidores públicos
// Além de anti-cheat, o VAC filtra alguns exploits do motor GoldSource
sv_cheats 0
// sv_secure é definido via linha de comando: +sv_secure 1

// Número máximo de jogadores simultâneos
maxplayers 20

// Taxa máxima de dados por cliente (bytes/seg) — evita flood de bandwidth
sv_maxrate 25000
sv_minrate 2500

// Limitar o FPS do servidor (reduz carga de CPU e pacotes gerados)
fps_max 100


// ---------------------------------------------------------------------------
// INFORMAÇÕES EXPOSTAS VIA A2S_INFO
// ---------------------------------------------------------------------------

// Ocultar a capacidade real do servidor nas consultas públicas
// -1 = não exibir, evita revelar exatamente quantas slots estão livres
sv_visiblemaxplayers -1

// Desabilitar download de arquivos customizados via servidor
// (reduz vetor de entrega de conteúdo malicioso a clientes)
sv_allowdownload 0
sv_allowupload 0


// ---------------------------------------------------------------------------
// LOGGING E MONITORAMENTO DEFENSIVO
// ---------------------------------------------------------------------------

// Habilitar log completo de eventos do servidor
log on

// Log de conexões e desconexões
sv_log_onefile 0     // Arquivo separado por sessão (melhor para auditoria)
sv_logblocks 1       // Logar tentativas de flood

// Intervalo de atualização dos logs (segundos)
sv_logsdir "logs"    // Diretório onde os logs são salvos (relativo ao mod)


// ---------------------------------------------------------------------------
// PERFORMANCE E ESTABILIDADE
// ---------------------------------------------------------------------------

// Timeout para desconectar jogadores inativos (segundos)
sv_timeout 65

// Rejeitar pacotes com tamanho anormal (possível exploit/flood)
sv_filterban 1

// Ativar proteção contra overflow de comandos do cliente
// (mitigação de alguns vetores de exploração de cliente→servidor)
sv_client_cmdrate_difference 0.5

// ---------------------------------------------------------------------------
// LINHA DE INICIALIZAÇÃO RECOMENDADA (hlds_run)
// ---------------------------------------------------------------------------
//
// ./hlds_run \
//   -game cstrike \
//   -dedicated \
//   +ip 0.0.0.0 \
//   +port 27015 \
//   +maxplayers 20 \
//   +map de_dust2 \
//   +sv_secure 1 \
//   -pingboost 2 \
//   -noipx \
//   -nojoy \
//   +exec server.cfg
//
// Para porta não-padrão (recomendado):
//   +port 28015
//
// ---------------------------------------------------------------------------
